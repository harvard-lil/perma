{% load visible_sponsorships %}
{% if user_management_perms.can_use_short_sponsorship_label %}
  <a class="action" href="{% url 'user_management_manage_single_sponsored_user' listed_user.id %}">edit <span class="visually-hidden">{{ listed_user.get_full_name}}</span></a>
{% else %}
  <a class="action" href="{% url 'user_management_manage_single_sponsored_user' listed_user.id %}">edit sponsorship{{ listed_user|visible_sponsorships:request.user|length|pluralize }}<span class="visually-hidden">for {{ listed_user.get_full_name}}</span></a>
{% endif %}
