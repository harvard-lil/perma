[project]
name = "perma"
version = "0.0.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "boto3~=1.43.81",
    "celery~=5.6.3",
    "django==5.2.17",
    "django-axes~=8.3.1",
    "django-filter~=26.1",
    "django-json-widget~=2.1.1",
    "django-model-utils~=5.0.0",
    "django-ratelimit~=4.1.0",
    "django-redis~=7.0.0",
    "django-settings-context-processor~=0.2",
    "django-simple-history~=3.13.0",
    "django-storages~=1.14.6",
    "django-taggit~=6.1.0",
    "django-tree-queries~=0.24.0",
    "django-waffle~=5.0.0",
    "django-webpack-loader~=1.0",
    "djangorestframework~=3.18.0",
    "internetarchive~=5.11.1",
    "invoke~=2.2.1",
    "ipdb~=0.13.13",
    "lxml~=6.1.2",
    "mock~=5.1.0",
    "netaddr~=1.3.0",
    "psycopg2~=2.9.12",
    "pynacl~=1.6.2",
    "redis~=4.5.4",
    "requests~=2.34.2",
    "sentry-sdk~=2.68.1",
    "surt~=0.3.1",
    "tempdir~=0.7.1",
    "timegate",
    "tqdm~=4.70.0",
    "typing-extensions~=4.16.0",
    "ua-parser~=1.0.2",
    "uwsgitop~=0.11",
    "warcio~=1.8.1",
    "warctools~=5.0.1",
    "werkzeug~=3.1.8",
    "whitenoise~=6.12.0",
]

[dependency-groups]
dev = [
    "beautifulsoup4~=4.12.3",
    "coverage~=7.4.3",
    "django-admin-smoke-tests~=0.3.0",
    "django-debug-toolbar~=7.1.1",
    "django-extensions~=4.1.0",
    "django-schema-viewer~=0.5.3",
    "factory-boy~=3.3.0",
    "fakeredis[lua]~=2.21.1",
    "flake8~=7.0.0",
    "flake8-pyproject~=1.2.4",
    "hypothesis~=6.98.17",
    "lupa~=2.8",
    "playwright~=1.62.0",
    "pyhumps~=3.8.0",
    "pytest~=9.1.1",
    "pytest-cov~=4.1.0",
    "pytest-django~=4.14.0",
    "pytest-django-liveserver-ssl~=0.0.3",
    "pytest-django-ordering~=1.2.0",
    "pytest-mock~=3.14.0",
    "pytest-playwright~=0.9.0",
    "pytest-xdist~=3.5.0",
    "watchdog~=4.0.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "perma.settings.deployments.settings_testing"
norecursedirs = ["node_modules"]
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "-n auto --dist loadscope --browser chromium --screenshot only-on-failure --output failed_test_files"
filterwarnings = ["ignore:Unverified HTTPS request"]
markers = [
    "uses_storage: marks tests that write to S3/MinIO storage (cleanup_storage teardown is skipped for unmarked tests)",
]

[tool.coverage.run]
source = ["."]
omit = [
    "*/migrations/*",
    "*/management/*",
    "*/tests/*",
    "fabfile/*",
    "functional_tests/*",
    "*/settings/*",
]

[tool.flake8]
ignore = ["E126", "E127", "E128", "E2", "W2", "E3", "W3", "E4", "E501", "W504"]
exclude = [".venv", "node_modules", "static", "settings"]

[tool.uv]
package = false

[tool.uv.sources]
timegate = { url = "https://github.com/mementoweb/timegate/archive/6810fbc873b84f6af8e78e89fc8515f21b695cae.zip" }
