services:
  #
  # Perma
  #
  # TO USE REDIS FOR CACHING:
  # Add the caches setting found in settings_prod to your settings.py,
  # with "LOCATION": "redis://perma-redis:6379/0"
  # (Don't clobber the Celery backend, which is at /1)
  perma-redis:
    image: registry.lil.tools/library/redis:4.0.6
    volumes:
      - redis_data:/data:delegated
  db:
    image: registry.lil.tools/library/postgres:16.6
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_DB: perma
      POSTGRES_USER: perma
    volumes:
      - postgres_data_16:/var/lib/postgresql/data:delegated
    networks:
      - default
      - superset
  web:
    image: registry.lil.tools/harvardlil/perma-web:143-689236a8e78ea0dbfc6b496b51bcb4ea
    tty: true
    command: bash
    # TO AUTOMATICALLY START PERMA:
    # (sleep hack to give the database and rabbitmq time to start up)
    # command: >
    #   sh -c "sleep 10 && ./manage.py migrate && invoke run"
    volumes:
      # NAMED VOLUMES
      - scoop_access_key:/tmp/scoop_access_key:ro
      # Use a named, persistent volume so that the node_modules directory,
      # which is created during the image's build process, and which our
      # code presently expects to be nested inside the perma_web directory,
      # isn't wiped out when mounting our code in ./perma_web code to
      # the container. We can consider restructuring the project instead.
      - node_modules:/perma/perma_web/node_modules
      # BIND MOUNTS
      - ./perma_web:/perma/perma_web
      - ./services/celery:/perma/services/celery
      - ./services/cloudflare:/perma/services/cloudflare
      - ./services/django:/perma/services/django:delegated
      - ./services/logs:/perma/services/logs:delegated
      # for playwright tests
      - ./services/docker/s3/ssl:/tmp/s3_ssl
      - ./services/docker/wacz-exhibitor/ssl:/tmp/wacz-exhibitor_ssl
    # give chrome lots of space for making big screenshots
    # https://github.com/elgalu/docker-selenium/issues/20
    shm_size: 2G
    environment:
      - DJANGO_LIVE_TEST_SERVER_ADDRESS=0.0.0.0
    extra_hosts:
      - "perma.test:127.0.0.1"
      - "api.perma.test:127.0.0.1"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - db
    networks:
      default:
        aliases:
          - 'perma.test'
          - 'api.perma.test'
      scoop_rest_api:
        aliases:
          - 'perma.test'

  #
  # S3-compatible storage
  #
  # Versity S3 Gateway with its posix backend: each bucket is a top-level
  # directory in the s3_data volume, and each object is a file at its key's path.
  # The perma.minio.test hostname predates the switch from MinIO and is kept so
  # existing hosts-file entries still work.
  s3:
    image: versity/versitygw:v1.8.0@sha256:30292fc2eeacc67a36993b01f7a7a5e3361a19cced0e80c1d71cfa2a4b0a2499
    entrypoint:
      - "/entrypoint.sh"
    environment:
      - ROOT_ACCESS_KEY=accesskey
      - ROOT_SECRET_KEY=secretkey
      - VGW_PORT=:9000
      - VGW_CERT=/ssl/public.crt
      - VGW_KEY=/ssl/private.key
      - VGW_CORS_ALLOW_ORIGIN=https://replay.perma.test:8000
      - VGW_BACKEND=posix
      - VGW_BACKEND_ARG=/data
      - BUCKET=perma-storage
      - SECONDARY_BUCKET=perma-secondary-storage
    volumes:
      - ./services/docker/s3/entrypoint.sh:/entrypoint.sh
      - ./services/docker/s3/ssl:/ssl
      - s3_data:/data
    ports:
      - "127.0.0.1:9000:9000"
    extra_hosts:
      - "perma.minio.test:127.0.0.1"
    networks:
      default:
        aliases:
          - 'perma.minio.test'

  #
  # wacz-exhibitor
  #
  wacz-exhibitor:
    image: registry.lil.tools/harvardlil/wacz-exhibitor:6-ec122b8e74374fd90ad71189cbd42b62
    ports:
      - "127.0.0.1:8080:8080"
    extra_hosts:
      - "rejouer.perma.test:127.0.0.1"
    networks:
      default:
        aliases:
          - 'rejouer.perma.test'
    volumes:
      - ./services/docker/wacz-exhibitor/ssl:/etc/nginx/certs

  #
  # Upload scanning
  #
  filecheck:
    image: registry.lil.tools/harvardlil/perma-filecheck:0.106
    environment:
      - UVICORN_PORT=8888
    ports:
      - "127.0.0.1:8888:8888"
    networks:
      - default


volumes:
  node_modules:
  postgres_data_16:
  redis_data:
  scoop_redis_data:
  scoop_postgres_data:
  scoop_access_key:
  s3_data:
  superset_data:

networks:
  default:
  scoop_rest_api:
      name: perma-scoop-api_default
  scoop_rest_api_internal:
  superset:
