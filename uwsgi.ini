# uwsgi for the ECS web role. Copied into the image at /perma/uwsgi.ini and
# started with `uwsgi --ini /perma/uwsgi.ini` (the prod image's CMD).
#
# Adapted from the Salt hosts' perma.ini (repos/salt/perma-server/files). The
# differences: uwsgi speaks HTTP itself on 8000 to the cloudflared sidecar
# instead of a unix socket to nginx; it runs as the container's user rather
# than switching to www-data; logs go to stdout for CloudWatch instead of a
# file; and it exits on SIGTERM.
[uwsgi]
chdir = /perma/perma_web
module = perma.wsgi:application
virtualenv = /opt/venv

# The sidecar reaches this over localhost; nothing else can reach the task.
http = 0.0.0.0:8000

master = true
processes = 5
threads = 1

# Sentry's SDK runs a background worker thread. With threads = 1 uwsgi does not
# initialise the interpreter's threading support unless told to, and the SDK
# warns and drops events. Salt's ini does not set this; see the report.
enable-threads = true

# --die-on-term is what makes SIGTERM mean "shut down". uwsgi's own meaning for
# it is "brutally reload", so without this the master ignores the signal ECS
# sends to stop a task, ECS waits out the stop timeout and kills it, and
# whatever the workers were serving dies with them. That defeats the drain the
# cloudflared sidecar performs ahead of it.
die-on-term = true

listen = 1000

max-requests = 500
max-requests-delta = 10

harakiri = 90
harakiri-verbose = true
socket-timeout = 90
http-timeout = 90

lazy-apps = true

post-buffering = 65536
buffer-size = 32768

# Request logging off, as on the Salt hosts; Cloudflare has the access log.
# Application logging still reaches stdout through Django's LOGGING.
disable-logging = true

ignore-sigpipe = true
ignore-write-errors = true
disable-write-exception = true

vacuum = true
