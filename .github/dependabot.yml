version: 2

updates:
  # Every third-party action in .github/workflows is pinned to a commit SHA,
  # which is what stops a compromised tag from arriving silently -- and also
  # what makes a pin invisible once set, since a SHA does not look stale.
  # Something has to raise them, hence this.
  #
  # Only `.github/workflows/` is scanned; the github-actions ecosystem does
  # not recurse into composite `action.yml` files, which is why lil-actions
  # lists each of its composite directories explicitly. This repository
  # defines no composite actions.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
