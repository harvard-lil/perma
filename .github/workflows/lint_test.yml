name: Lint and Test

on:
  workflow_call:
    secrets:
      # Declared so a caller can pass exactly what a given event needs. A
      # pull_request run gets only CODECOV_TOKEN; publishing values are
      # required=false and simply absent there, which is what keeps the
      # publish steps unable to run even if their `if:` guards were wrong.
      CODECOV_TOKEN:
        required: false
      BUILD_AWS_ROLE_TO_ASSUME:
        required: false
      STAGING_AWS_REGION:
        required: false

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          cache-dependency-glob: perma_web/uv.lock

      - name: Run flake8
        working-directory: perma_web
        run: uv run --frozen --only-group dev flake8

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    env:
      # The one repository Perma's images are published to and both tiers
      # deploy from. Named here rather than read from an environment because
      # it is the same name in every tier.
      ECR_REPOSITORY: perma
      # Compose reads this itself, so every `docker compose` call below picks
      # up both files with no flags. Setting it also stops compose auto-loading
      # docker-compose.override.yml, which is developer-only.
      COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
    # don't run on pushes to forks
    if: github.event_name == 'pull_request' || github.repository == 'harvard-lil/perma'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Build the deployable image and the image the suite runs against in one
      # go. `test` is FROM `prod`, so this produces prod's layers once and
      # tests against exactly them.
      #
      # Nothing is pushed here. The prod image is held locally and published
      # further down, only if the suite is green. Deliberately uncached, for
      # the reasons h2o's lint_test.yml records: a remote layer cache was
      # measured there at about ten seconds saved on a five-minute job.
      #
      # PERMA_VERSION is the Dockerfile's build argument (ARG -> ENV in the
      # prod stage; settings_ecs reports it, and it lands in the
      # datapackage.json of user uploads). Salt computed it from the branch
      # tip at deploy time; here the image carries the commit it was built
      # from. The same value goes to both builds: the ARG sits above the
      # collectstatic layer, so a test build with a different value would
      # rebuild prod's layers instead of reusing them.
      - name: Build the prod and test images
        env:
          PERMA_VERSION: ${{ github.sha }}
        run: |
          set -euxo pipefail
          docker buildx build \
            --target prod \
            --build-arg "PERMA_VERSION=${PERMA_VERSION}" \
            --load \
            -t perma-prod:${{ github.sha }} \
            -f ./Dockerfile .

          # `test` reuses the prod layers just built, so this is nearly free.
          docker buildx build \
            --target test \
            --build-arg "PERMA_VERSION=${PERMA_VERSION}" \
            --load \
            -t perma-test:ci \
            -f ./Dockerfile .

      # The collected static files and the migration list are built into the
      # image (see the Dockerfile), so they are read out of it with `docker
      # create`, which gives a container filesystem without starting anything.
      # They describe the image that ships rather than whatever a running
      # service happened to have on disk. Both are needed as files on the
      # runner for the attachment seam further down.
      - name: Extract the image's static files and migration list
        run: |
          set -euxo pipefail
          rm -rf image-artifacts
          mkdir -p image-artifacts
          container="$(docker create "perma-prod:${{ github.sha }}")"
          docker cp "${container}:/perma/perma_web/static-collected" image-artifacts/static
          docker cp "${container}:/perma/perma_web/migrations.json" image-artifacts/migrations.json
          docker rm "${container}"

          # admin and rest_framework come from installed packages, bundles
          # from the assets stage: all three are there only if collectstatic
          # ran during the build against a complete tree.
          for collected in admin rest_framework bundles; do
            test -d "image-artifacts/static/${collected}"
          done
          jq -e '.migrations | length > 0' image-artifacts/migrations.json
          jq -r '"migrations.json: \(.count) migrations, hash \(.hash)"' image-artifacts/migrations.json

      # The functional tests drive a browser against a TLS live server and a
      # TLS MinIO, and Playwright will not accept an untrusted certificate for
      # that, so the certificates come from a CA the browser trusts. mkcert
      # from the distribution's package, rather than a release binary fetched
      # from GitHub by version-less URL as the previous workflow did.
      - name: Install mkcert
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mkcert libnss3-tools
          mkcert -install

      # make_cert.sh writes the CA root and the per-host certificates into the
      # working tree. docker-compose.ci.yml bind-mounts exactly those files,
      # read-only, into the web container (the code itself is not mounted;
      # the image's copy is what runs), and MinIO and wacz-exhibitor read
      # theirs from the mounts docker-compose.yml gives them. Before `up`,
      # because a bind mount of a file that does not exist yet creates a
      # directory in its place. The script's two `docker compose restart`
      # calls are no-ops here: nothing is running yet.
      - name: Generate test certificates
        run: bash make_cert.sh

      # Two compose invocations, as the previous workflow made them. The
      # first is Perma's own stack from COMPOSE_FILE (the CI override, no
      # developer override). The second starts the Scoop API and its Redis and
      # Postgres, which are defined only in docker-compose.override.yml: the
      # link-validation tests in api/tests call it, and fail without it.
      # Named services only, so nothing else in the override file is started
      # or built; the web service is untouched.
      - name: docker compose up
        run: |
          docker compose pull --ignore-pull-failures || true
          docker compose up -d
          docker compose -f docker-compose.yml -f docker-compose.override.yml \
            up -d scoop-redis scoop-db scoop-rest-api
          docker ps -a
          docker compose logs

      - name: Javascript tests
        shell: 'script -q -e -c "bash --noprofile --norc -eo pipefail {0}"'  # avoid docker-compose "the input device is not a TTY" -- see https://github.com/actions/runner/issues/241#issuecomment-842566950
        run: |
          set -x
          # No npm install or npm run build: node_modules and the compiled
          # bundles both come from the assets stage, inside the image.
          docker compose exec web npm run test

      - name: Python tests
        shell: 'script -q -e -c "bash --noprofile --norc -eo pipefail {0}"'  # avoid docker-compose "the input device is not a TTY" -- see https://github.com/actions/runner/issues/241#issuecomment-842566950
        run: |
          set -x
          docker compose exec web invoke dev.init-db
          # -n auto, --dist loadscope and the Playwright flags come from
          # pyproject.toml's addopts.
          docker compose exec web pytest \
            --cov --cov-report xml  `# write coverage data to .coverage for upload by codecov` \
            -vv

      # pytest writes coverage.xml inside the container. CI mounts nothing, so
      # without this codecov finds no report -- it fails soft, so that would
      # pass silently rather than erroring.
      - name: Extract coverage report
        run: |
          set -euxo pipefail
          docker compose cp web:/perma/perma_web/coverage.xml perma_web/coverage.xml
          test -s perma_web/coverage.xml

      ### codecov ###
      # https://github.com/codecov/codecov-action
      - name: Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      # One OIDC session for everything below that touches AWS, under an
      # identity that can publish images and cannot deploy them.
      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ secrets.BUILD_AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.STAGING_AWS_REGION }}

      - name: Login to AWS ECR
        id: publish-ecr-login
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      # A commit is published once. This build is not reproducible -- no
      # cache, a floating base image, unpinned apt -- so re-running develop
      # produces different bytes for the same source, and pushing them would
      # move the SHA tag off the image the earlier run tested and staging may
      # already be running.
      #
      # Refusing is the whole of it: there is no safe partial republish. The
      # collected static files travel inside the image, so a second push of
      # this commit would move the SHA tag -- and the assets that go with it
      # -- to bytes nothing has tested.
      - name: Refuse to republish a commit
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        env:
          SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          # describe-images does not answer "no" -- it fails, with
          # ImageNotFoundException, and that is the ordinary case here. So the
          # exit status is the answer, and anything that is not a missing image
          # is a question this cannot answer rather than a no.
          if out="$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" \
                     --image-ids "imageTag=${SHA}" \
                     --query 'imageDetails[0].imageDigest' --output text 2>&1)"; then
            echo "::error::${ECR_REPOSITORY}:${SHA} already exists, at ${out}."
            echo "::error::An earlier run published this commit. Re-running would replace"
            echo "::error::what it published with bytes nothing has tested."
            echo "::error::To ship a change, push a new commit. To genuinely replace what"
            echo "::error::was published, delete the tag named above and run this again."
            exit 1
          elif ! grep -q 'ImageNotFoundException' <<< "$out"; then
            echo "::error::Could not tell whether ${ECR_REPOSITORY}:${SHA} is published."
            echo "::error::${out}"
            exit 1
          fi
          echo "Nothing published for ${SHA} yet."

      # Push the image built at the top of this job -- not a rebuild. Tagged
      # with the commit develop actually points at, so staging can find it.
      - name: Publish the prod image to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        env:
          REGISTRY: ${{ steps.publish-ecr-login.outputs.registry }}
        run: |
          set -euxo pipefail
          docker tag "perma-prod:${{ github.sha }}" "${REGISTRY}/${ECR_REPOSITORY}:${{ github.sha }}"
          docker push "${REGISTRY}/${ECR_REPOSITORY}:${{ github.sha }}"

      # The ORAS project's own action, pinned to a commit like every other
      # action here. Which ORAS it installs is the action's default rather
      # than a version named here, so that dependabot maintains the whole
      # thing; nothing below depends on a particular ORAS.
      - name: Install oras
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1

      # `image-artifacts/static` and `image-artifacts/migrations.json` are on
      # the runner from the extraction step near the top of this job, and the
      # image they were read out of has just been pushed. Attaching them to
      # that image as OCI referrers is what lets a deploy learn what an image
      # contains -- which assets to publish, which migrations it expects --
      # without starting it or pulling it. ECR answers the referrers API
      # natively and filters by artifact type server-side, so a reader fetches
      # one of these with three requests and no oras binary.
      #
      # Nothing publishes the static files to S3 here; the bucket is the
      # deploy's to write, from these referrers.
      - name: Attach the static files and migration list to the pushed image
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        env:
          REGISTRY: ${{ steps.publish-ecr-login.outputs.registry }}
          SHA: ${{ github.sha }}
          MIGRATIONS_TYPE: application/vnd.harvard-lil.perma.migrations.v1+json
          STATIC_TYPE: application/vnd.harvard-lil.perma.staticassets.v1.tar+gzip
        run: |
          set -euxo pipefail

          # A referrer's subject is a digest, so the registry says which digest
          # the tag just pushed resolves to rather than the local image saying.
          DIGEST="$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=${SHA}" \
            --query 'imageDetails[0].imageDigest' --output text)"
          IMAGE="${REGISTRY}/${ECR_REPOSITORY}@${DIGEST}"

          # Sorted names and zeroed mtimes, owners and gzip header, so one image
          # produces one tarball: the bytes decide the blob digest, and the blob
          # digest decides whether a re-attach is the same referrer or a second
          # one.
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner \
            -cf - -C image-artifacts static | gzip -n > static-assets.tar.gz

          # oras stamps org.opencontainers.image.created with the current time
          # unless it is given one, which makes every attach of identical
          # content a distinct referrer. A fixed value keeps attach idempotent.
          oras attach --artifact-type "$MIGRATIONS_TYPE" \
            --annotation "org.opencontainers.image.created=1970-01-01T00:00:00Z" \
            "$IMAGE" image-artifacts/migrations.json:application/json

          oras attach --artifact-type "$STATIC_TYPE" \
            --annotation "org.opencontainers.image.created=1970-01-01T00:00:00Z" \
            "$IMAGE" static-assets.tar.gz:application/gzip
