name: Lint and Test

# Perma's integration branch is `develop`, playing the role `main` plays in
# h2o: a push here builds the image once, runs the suite against it, and
# publishes it to ECR under the commit SHA for the staging deploy to promote.

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

concurrency:
  group: perma-build-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  # Pull requests only ever test: a read-only token and the one secret the
  # suite uses. The build role is a repository variable, so there is nothing
  # else to withhold from a branch build.
  test:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: ./.github/workflows/lint_test.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # A new commit on develop runs the same suite and then publishes. A retry
  # first verifies the immutable image and its required referrers; a complete
  # publication is reused without rebuilding or retesting it.
  test-and-publish:
    if: github.event_name == 'push'
    permissions:
      id-token: write   # assume the build AWS role
      contents: read    # nothing commits back to develop any more
    uses: ./.github/workflows/lint_test.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
