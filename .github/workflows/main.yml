name: Lint and Test

# Perma's integration branch is `develop`, playing the role `main` plays in
# h2o: a push here builds the image once, runs the suite against it, and
# publishes it to ECR under the commit SHA for the staging deploy to promote.

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  # Pull requests only ever test. No publishing, so no publishing credentials:
  # a read-only token and one named secret, rather than `secrets: inherit`
  # handing the whole repository's secrets to a branch build.
  test:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: ./.github/workflows/lint_test.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Pushes to develop run the same suite and then publish, so they need the
  # OIDC scope for the build role and the repository's publishing values.
  test-and-publish:
    if: github.event_name == 'push'
    permissions:
      id-token: write   # assume the build AWS role
      contents: read    # nothing commits back to develop any more
    uses: ./.github/workflows/lint_test.yml
    secrets: inherit
