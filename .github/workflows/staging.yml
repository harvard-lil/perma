name: Staging - Deploy to AWS

# The ECS line's staging branch is `staging`, matching h2o and the org
# standard. Perma's older `stage` branch belongs to the Salt line and is
# deployed by Salt, not by this workflow. The GitHub environment this deploys
# through is also named `staging`, with a branch policy limiting it to the
# `staging` branch.

on:
  workflow_dispatch:
    inputs:
      hold-maintenance:
        description: Keep traffic held after a successful deploy (the tunnel cutover); implies force-maintenance
        type: boolean
        default: false
      force-maintenance:
        description: Open a maintenance window whether or not migrations call for one
        type: boolean
        default: false
      skip-maintenance:
        description: Assert the migrations are compatible with serving traffic and take no window
        type: boolean
        default: false
  pull_request:
    branches: [staging]
  push:
    branches: [staging]

# Nothing by default. Only the jobs that run on a push to the tier branch,
# under its locked environment, are granted id-token (below); a pull request
# never gets one.
permissions:
  contents: read

concurrency:
  group: perma-staging-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'deploy' }}
  cancel-in-progress: false

jobs:
  # Only allow merges from main, from this repository.
  check-source-branch:
    name: Check Source Branch
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Verify source branch is main
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$HEAD_REPOSITORY" != "$REPOSITORY" ]; then
            echo "::error::Pull requests to staging cannot come from forks."
            exit 1
          fi
          if [ "$HEAD_REF" != "main" ]; then
            echo "::error::Pull requests to staging must come from the main branch."
            exit 1
          fi
          echo "Source branch verification passed"

      - name: Require a successful source workflow
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Check the exact source commit, not an unrelated green branch tip.
          runs="$(gh api --method GET "repos/${REPOSITORY}/actions/workflows/main.yml/runs" \
            -f head_sha="$HEAD_SHA" -f event=push -f per_page=100)"
          if ! jq -e --arg sha "$HEAD_SHA" '
            [.workflow_runs[] | select(.head_sha == $sha and .head_branch == "main")]
            | sort_by(.run_number) | last
            | .status == "completed" and .conclusion == "success"
          ' <<< "$runs" >/dev/null; then
            echo "::error::The exact main source commit needs a successful main.yml push run. Rerun this check after it succeeds."
            exit 1
          fi

  # Neither deploy tier lints or tests. A pull request into staging gets no
  # AWS credentials at all: its head is main, and main.yml's test-and-publish
  # check on that commit, which the pull request displays, only passes once
  # the image and its three referrers are published. The promotion checks
  # below run on a push or a dispatch on staging, under the staging
  # environment (locked to the staging branch), before anything changes.
  # They read metadata and referrers only: nothing here rebuilds, pulls, or
  # starts the image.
  prepare:
    name: Prepare the staging artifact
    if: >-
      github.repository == 'harvard-lil/perma' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      id-token: write   # assume the staging deploy role via OIDC
      contents: read

    outputs:
      image-digest: ${{ steps.resolve.outputs.image-digest }}
      source-sha: ${{ steps.resolve.outputs.source-sha }}

    env:
      ECR_REPOSITORY: perma

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # need merge parents to resolve the main commit we promote

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: us-east-1

      - name: Login to AWS ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      # Promote, do not rebuild. lint_test.yml built this image on main,
      # ran the suite against it, and pushed it tagged with the main commit
      # SHA. The candidate must have the same source tree as the promoted
      # revision, so a merge that changed the tree without a build is refused.
      - name: Resolve the tested image
        id: resolve
        uses: harvard-lil/lil-actions/ecr-resolve-git-image@main
        with:
          repository: ${{ env.ECR_REPOSITORY }}
          registry: ${{ steps.login-ecr.outputs.registry }}

      - name: Require the published image and its referrers
        id: publication
        uses: harvard-lil/lil-actions/ecr-publication-state@main
        with:
          repository: ${{ env.ECR_REPOSITORY }}
          registry: ${{ steps.login-ecr.outputs.registry }}
          tag: ${{ steps.resolve.outputs.source-sha }}
          required-artifact-types: >-
            ["application/vnd.harvard-lil.django.migrations.v1+json",
             "application/vnd.harvard-lil.perma.celery-tasks.v1+json",
             "application/vnd.harvard-lil.perma.staticassets.v1.tar+gzip"]

      - name: Verify complete publication of the selected digest
        env:
          PUBLICATION_STATE: ${{ steps.publication.outputs.state }}
          PUBLISHED_DIGEST: ${{ steps.publication.outputs.digest }}
          SELECTED_DIGEST: ${{ steps.resolve.outputs.image-digest }}
          MISSING: ${{ steps.publication.outputs.missing-artifact-types }}
        run: |
          if [ "$PUBLICATION_STATE" != complete ]; then
            echo "::error::Publication is '$PUBLICATION_STATE'; missing referrer types: $MISSING"
            exit 1
          fi
          test "$PUBLISHED_DIGEST" = "$SELECTED_DIGEST"

  # The shared sequence. Everything above identifies which artifact to deploy;
  # everything below is identical for both tiers and lives in one file so a
  # staging run exercises production's code.
  deploy:
    needs: prepare
    # Named rather than left to the default success(): a job with no condition
    # of its own is skipped when anything in its needs graph is skipped.
    if: always() && needs.prepare.result == 'success'
    permissions:
      id-token: write
      contents: read
      pull-requests: read
    uses: ./.github/workflows/deploy_sequence.yml
    with:
      environment: staging
      environment-label: Staging
      image-digest: ${{ needs.prepare.outputs.image-digest }}
      source-sha: ${{ needs.prepare.outputs.source-sha }}
      # Guarded on the event so a push passes false rather than an empty value
      # to a boolean input; the sequence's deploy-flags step applies the same
      # guard before it reads them.
      force-maintenance: ${{ github.event_name == 'workflow_dispatch' && inputs.force-maintenance }}
      skip-maintenance: ${{ github.event_name == 'workflow_dispatch' && inputs.skip-maintenance }}
      hold-maintenance: ${{ github.event_name == 'workflow_dispatch' && inputs.hold-maintenance }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # A job whose condition does not hold is skipped, and a skipped job leaves
  # the run green. This job is what makes a deploy that did not happen show up
  # as a failed run rather than a successful build. Pull requests are meant to
  # stop after prepare, so they are not held to it.
  confirm-deploy:
    name: Confirm the deploy ran
    needs: [prepare, deploy]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Require a completed deploy
        env:
          RESULT: ${{ needs.deploy.result }}
        run: |
          if [ "$RESULT" != "success" ]; then
            echo "::error::prepare succeeded but deploy was '$RESULT'; nothing was deployed."
            exit 1
          fi
          echo "deploy completed"
